name: Aura Digital - Monitoreo Cloudflare
run-name: Aura R2 · ${{ github.event.client_payload.request_id || github.event_name }}
on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [aura-monitor-refresh]
  # Ejecutar también cuando se repara el monitor, sin esperar al día siguiente.
  push:
    paths:
      - 'cloudflare-monitor/**'
      - '.github/workflows/aura-cloudflare-monitor.yml'

permissions:
  contents: write

concurrency:
  group: auradigital-monitor-cloudflare
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Verificar monitor sin credenciales
        run: python3 -m unittest discover -s cloudflare-monitor/tests -v

      - name: Obtener metricas (sin modificar R2)
        id: monitor
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "## Monitoreo pendiente de configurar" >> "$GITHUB_STEP_SUMMARY"
            echo "Agregar el secreto CLOUDFLARE_API_TOKEN y la variable CLOUDFLARE_ACCOUNT_ID." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 cloudflare-monitor/monitor.py
          cat cloudflare-monitor/reportes/RESUMEN.md >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Guardar reporte como artefacto (30 dias)
        if: steps.monitor.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aura-cloudflare-reporte
          path: cloudflare-monitor/reportes/
          retention-days: 30
          if-no-files-found: error

      # Solo exportamos conteos globales. El token, cuenta, rutas y fotos NUNCA salen.
      # Se publica en otra rama para no disparar despliegues de la plataforma en main.
      - name: Actualizar datos del monitor en rama independiente
        if: steps.monitor.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq '{
            consultado_utc, mes_desde_utc,
            almacenamiento: (.almacenamiento | {megabytes, objetos}),
            operaciones_mes_bucket: (.operaciones_mes_bucket | {A, B, sin_clasificar}),
            transferencia_mes_bucket: (.transferencia_mes_bucket | {bytesUpload, bytesDownload}),
            worker: (.worker | {requests, errors}),
            worker_dia_cuenta: (.worker_dia_cuenta | {desde_utc, requests, errors}),
            alertas_orientativas
          }' cloudflare-monitor/reportes/ultimo.json > /tmp/aura-monitor-publico.json
          target="cloudflare-monitor/estado/ultimo.json"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$target?ref=monitor-estado" --jq '.sha' 2>/dev/null || true)"
          encoded="$(base64 -w 0 /tmp/aura-monitor-publico.json)"
          jq -n \
            --arg message "Actualizar resumen agregado de Cloudflare" \
            --arg content "$encoded" \
            --arg branch "monitor-estado" \
            --arg sha "$current_sha" \
            '{message:$message,content:$content,branch:$branch} +
             (if $sha == "" then {} else {sha:$sha} end)' > /tmp/aura-monitor-payload.json
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/$target" \
            --input /tmp/aura-monitor-payload.json > /dev/null
          echo "Informe agregado actualizado en monitor-estado."
